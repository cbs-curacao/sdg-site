# ****************************************************************************
# Production deployment of the SITE.
#
# Trigger: push to the "master" branch, a manual run from the Actions tab, or
# automatically by the sdg-data production workflow after new data is published.
# Builds the site with the production config and publishes it to:
#   https://github.com/cbs-curacao-sdg/cbs-curacao-sdg.github.io  (branch main)
#   -> https://cbs-curacao-sdg.github.io/
#
# Secret used: PROD_TOKEN - fine-grained token, owner cbs-curacao-sdg,
#              Contents: read/write
# ****************************************************************************

name: Deploy to production

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Set up Ruby 3.2
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
    - name: Build the site
      run: |
        gem install bundler
        bundle config path vendor/bundle
        bundle install
        JEKYLL_ENV=production bundle exec jekyll build --config _config.yml,_config_prod.yml
        touch _site/.nojekyll
    - name: Deploy to GitHub Pages (production organisation)
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        repository-name: cbs-curacao-sdg/cbs-curacao-sdg.github.io
        token: ${{ secrets.PROD_TOKEN }}
        branch: main
        folder: _site
        clean: true
